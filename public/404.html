<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <title>Page not found — Ortu</title>
    <meta
      name="description"
      content="That page doesn't exist. Head back to Ortu — the free, open-source, local-first clipboard manager for macOS, Windows and Linux."
    />
    <meta name="theme-color" content="#08090c" />
    <!-- Keep 404s out of the index; they carry no content worth ranking. -->
    <meta name="robots" content="noindex,follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        --bg: #08090c;
        --fg: #ffffff;
        --muted: #a1a1aa;
        --dim: #71717a;
        --accent: #ff8a3d;
        --accent-hover: #ff9a56;
        --border: #2d3136;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.25rem;
        background:
          radial-gradient(1200px 600px at 20% -20%, rgba(174, 178, 145, 0.1), transparent),
          linear-gradient(180deg, #08090c 0%, #0d0f13 100%);
        background-attachment: fixed;
        color: var(--muted);
        font-family: "Manrope", "Avenir Next", "Segoe UI", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: rgba(255, 138, 61, 0.2);
        color: #fff;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--fg);
        font-weight: 800;
        font-size: 1.05rem;
        text-decoration: none;
        letter-spacing: -0.02em;
        margin-bottom: 2.5rem;
      }
      .brand img {
        width: 26px;
        height: 26px;
      }
      .code {
        font-size: clamp(3.5rem, 12vw, 5.5rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        color: var(--fg);
        margin: 0;
      }
      h1 {
        font-size: clamp(1.1rem, 3vw, 1.35rem);
        font-weight: 700;
        color: var(--fg);
        margin: 1rem 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 auto;
        max-width: 30rem;
        color: var(--dim);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-top: 2rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1.25rem;
        border-radius: 0.7rem;
        font-weight: 600;
        font-size: 0.925rem;
        text-decoration: none;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }
      .btn-primary {
        background: var(--accent);
        color: #08090c;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-ghost {
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .btn-ghost:hover {
        border-color: var(--dim);
        color: var(--fg);
      }
      .links {
        margin-top: 2.5rem;
        font-size: 0.85rem;
        color: var(--dim);
      }
      .links a {
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid var(--border);
      }
      .links a:hover {
        color: var(--fg);
      }
      .sep {
        margin: 0 0.6rem;
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <a class="brand" href="/">
      <img src="/app-icon.svg" alt="" />
      Ortu
    </a>

    <p class="code">404</p>
    <h1>This page doesn't exist</h1>
    <p>
      The link may be out of date, or the page may have moved. Everything about Ortu — the free,
      open-source clipboard manager for macOS, Windows and Linux — is one click away.
    </p>

    <div class="actions">
      <a class="btn btn-primary" href="/">Back to Ortu</a>
      <a class="btn btn-ghost" href="/#download">Download</a>
    </div>

    <p class="links">
      <a href="https://github.com/abhijith-p-subash/ortu">GitHub</a>
      <span class="sep">·</span>
      <a href="/privacy-policy">Privacy</a>
      <span class="sep">·</span>
      <a href="/code-signing-policy">Code signing</a>
    </p>
  </body>
</html>
